[project]
name = "pytest-trim"
version = "0.1.0"
description = "A pytest plugin that emits compact, machine-friendly failure output."
readme = "README.md"
authors = [
    {name = "Panos Mavrogiorgos",email = "pmav99@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8,<10)",
]

[project.entry-points.pytest11]
trim = "pytest_trim.plugin"

[tool.poetry]
packages = [
    {include = "pytest_trim", from = "src"},
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-xdist",
    "pytest-cov",
    "poetry-core"
]
