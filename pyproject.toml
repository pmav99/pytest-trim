[project]
name = "pytest-trim"
version = "0.1.0"
description = "A pytest plugin that emits compact, machine-friendly failure output."
readme = "README.md"
authors = [
    {name = "Panos Mavrogiorgos",email = "pmav99@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8,<10)",
]

[project.entry-points.pytest11]
trim = "pytest_trim_bootstrap"

[tool.poetry]
packages = [
    {include = "pytest_trim", from = "src"},
    {include = "pytest_trim_bootstrap", from = "src"},
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[tool.coverage.run]
branch = true
source = ["pytest_trim"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'if T\.TYPE_CHECKING:',
    'if ty.TYPE_CHECKING:',
    'if typing\.TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
    # Comments to turn coverage on and off:
    'no cover: start(?s:.)*?no cover: stop',
    # A pragma comment that excludes an entire file:
    '\A(?s:.*# pragma: exclude file.*)\Z',
]
fail_under = 100
